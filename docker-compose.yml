services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-sync-dashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm_sync_dashboard
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
